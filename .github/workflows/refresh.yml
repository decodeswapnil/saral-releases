name: Refresh an existing Saral release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full private source commit to build (version stays unchanged)
        required: true
permissions:
  contents: read
concurrency:
  group: saral-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - id: version
        name: Pin the private source and verify the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess
          version=json.load(open('package.json'))['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+',version):raise SystemExit('Numeric version required')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tag='v'+version
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo','decodeswapnil/saral-releases','--json','isDraft,tagName'],text=True))
          if release['isDraft'] or release['tagName']!=tag:raise SystemExit('Select an existing published release')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write(f'tag={tag}\nversion={version}\nsource_sha={sha}\n')
          print('Refresh '+tag+' from '+sha)
          PYTHON
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GITHUB_REF_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ${{ needs.version.outputs.source_sha }}
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bundle local speech inference
        run: python tools/install_local_runtime.py
      - name: Scan for credentials
        run: python tools/check_secrets.py
      - name: Run regression and privacy checks
        run: python -m pytest tests -q
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Check update safety
        run: npm run check:desktop
      - name: Check native interface and recording lifecycle
        env:
          PYTHON: python
        run: node tests/desktop_ui.cjs
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python tools/build.py
      - name: Build Mac installer with persistent community identity
        if: runner.os == 'macOS'
        env:
          SARAL_COMMUNITY_P12: ${{ secrets.SARAL_COMMUNITY_P12 }}
          SARAL_COMMUNITY_PASSWORD: ${{ secrets.SARAL_COMMUNITY_PASSWORD }}
        run: python tools/community_signing.py build
      - name: Check packaged privacy
        run: python tools/check_package.py dist/desktop/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Saral-refresh-${{ matrix.artifact }}
          retention-days: 7
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
            dist/desktop/*SHA256SUMS.txt
          if-no-files-found: error
  release:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ${{ needs.version.outputs.source_sha }}
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Saral-refresh-*
          path: packages
          merge-multiple: true
      - name: Replace installers only after all three native builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          sha256sum packages/*.dmg packages/*.exe | sed 's|  packages/|  |' > packages/SHA256SUMS.txt
          python tools/release_manifest.py packages --version "$RELEASE_VERSION"
          gh release upload "$RELEASE_TAG" packages/*.dmg packages/*.exe packages/SHA256SUMS.txt packages/release-status.json --clobber --repo decodeswapnil/saral-releases
          gh release edit "$RELEASE_TAG" --repo decodeswapnil/saral-releases --notes-file RELEASE_NOTES.md
