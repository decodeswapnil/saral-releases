name: Build and publish Saral
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Private source version tag (blank selects newest)
        required: false
        default: ''
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: saral-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - id: version
        name: Select a new private source version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.error
          tags=subprocess.check_output(['git','tag'],text=True).splitlines()
          tags=[tag for tag in tags if re.fullmatch(r'v\d+\.\d+\.\d+',tag)]
          requested=os.environ.get('REQUESTED_TAG','')
          tag=requested or max(tags,key=lambda value:tuple(map(int,value[1:].split('.'))))
          if tag not in tags or not re.fullmatch(r'v\d+\.\d+\.\d+',tag):
              raise SystemExit('Select an existing numeric version tag.')
          package=json.loads(subprocess.check_output(['git','show',tag+':package.json'],text=True))
          if package['version']!=tag[1:]:raise SystemExit('The tag and application version must match.')
          request=urllib.request.Request('https://api.github.com/repos/decodeswapnil/saral-releases/releases/tags/'+tag,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request) as response:release=json.load(response)
              build=release.get('draft',False)
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              build=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'tag={tag}\nversion={tag[1:]}\nbuild={str(build).lower()}\n')
          print('New release selected: '+tag if build else 'Already published: '+tag)
          PY
  desktop:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GITHUB_REF_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ${{ needs.version.outputs.tag }}
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bundle local speech inference
        run: python tools/install_local_runtime.py
      - name: Scan for credentials
        run: python tools/check_secrets.py
      - name: Run regression and privacy checks
        run: python -m pytest tests -q
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Check update safety
        run: npm run check:desktop
      - name: Check native interface and recording lifecycle
        env:
          PYTHON: python
        run: node tests/desktop_ui.cjs
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python tools/build.py
      - name: Build Mac installer with persistent community identity
        if: runner.os == 'macOS'
        env:
          SARAL_COMMUNITY_P12: ${{ secrets.SARAL_COMMUNITY_P12 }}
          SARAL_COMMUNITY_PASSWORD: ${{ secrets.SARAL_COMMUNITY_PASSWORD }}
        run: python tools/community_signing.py build
      - name: Check packaged privacy
        run: python tools/check_package.py dist/desktop/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Saral-build-${{ matrix.artifact }}
          retention-days: 7
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
            dist/desktop/*SHA256SUMS.txt
          if-no-files-found: error
  release:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ${{ needs.version.outputs.tag }}
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Saral-build-*
          path: packages
          merge-multiple: true
      - name: Publish tested installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          sha256sum packages/*.dmg packages/*.exe > packages/SHA256SUMS.txt
          python tools/release_manifest.py packages --version "$RELEASE_VERSION"
          gh release create "$RELEASE_TAG" packages/*.dmg packages/*.exe packages/SHA256SUMS.txt packages/release-status.json --repo decodeswapnil/saral-releases --title "Saral $RELEASE_TAG" --prerelease --notes-file RELEASE_NOTES.md
