name: Build Saral comparison installers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saral-polished-preview
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ef7a07f291f85d3f0d0c370fdb03d2a459694b73
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/install_local_runtime.py
      - run: npm ci --no-audit --no-fund
      - run: python tools/check_secrets.py
      - run: python -m pytest tests -q
      - run: npm run check:desktop
      - name: Native interface and recording safety
        env:
          PYTHON: python
        run: node tests/desktop_ui.cjs
      - name: Build separate comparison installers
        run: python tools/build_studio_preview.py --installers --name "Saral Polished Preview" --app-id com.decodeswapnil.saral.polished.preview
      - run: python tools/check_package.py dist/studio-preview/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Saral-Polished-Preview-${{ matrix.artifact }}
          path: |
            dist/studio-preview/*.zip
            dist/studio-preview/*.dmg
            dist/studio-preview/*.exe
          if-no-files-found: error
