name: Connected desktop validation (no publication)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch or commit to test (never publishes)
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: saral-connected-${{ inputs.source_ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
    steps:
      - name: Isolate downloaded test models
        run: python -c "import os; open(os.environ['GITHUB_ENV'], 'a', encoding='utf8').write('HF_HOME='+os.path.join(os.environ['RUNNER_TEMP'], 'saral-test-models')+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: decodeswapnil/saral
          ref: ${{ inputs.source_ref || 'main' }}
          ssh-key: ${{ secrets.SARAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install platform-local speech engine
        run: python tools/install_local_runtime.py
      - name: Scan source for credentials
        run: python tools/check_secrets.py
      - name: Check regressions and real Windows tray, HUD and clipboard
        run: python -m pytest tests -q --junitxml=build/windows-tests.xml
      - name: Install native desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Test update and analytics safety
        run: npm run check:desktop
      - name: Test native onboarding and recording lifecycle
        env:
          PYTHON: python
        run: node tests/desktop_ui.cjs
      - name: Build Windows executable and frozen runtime checks
        if: runner.os == 'Windows'
        run: python tools/build.py
      - name: Build Mac with the existing community signing identity
        if: runner.os == 'macOS'
        env:
          SARAL_COMMUNITY_P12: ${{ secrets.SARAL_COMMUNITY_P12 }}
          SARAL_COMMUNITY_PASSWORD: ${{ secrets.SARAL_COMMUNITY_PASSWORD }}
        run: python tools/community_signing.py build
      - name: Scan packaged archive for user data and credentials
        run: python tools/check_package.py 'dist/desktop/*.zip'
      - name: Prepare isolated synthetic speech and tiny model
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $speech = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $speech.SetOutputToWaveFile("$env:RUNNER_TEMP\saral-speech-original.wav")
            $speech.Speak('The meeting starts on Friday. Please send the report before lunch.')
            $speech.SetOutputToWaveFile("$env:RUNNER_TEMP\saral-second-original.wav")
            $speech.Speak('The second recording is about the budget. We will review the budget on Monday.')
          } finally { $speech.Dispose() }
          & .\dist\desktop\win-unpacked\resources\media\ffmpeg.exe -y -i "$env:RUNNER_TEMP\saral-speech-original.wav" -ar 16000 -ac 1 -c:a pcm_s16le "$env:RUNNER_TEMP\saral-speech.wav"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny', allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*','preprocessor_config.json'], max_workers=2)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\desktop\win-unpacked\resources\media\ffmpeg.exe -y -i "$env:RUNNER_TEMP\saral-second-original.wav" -ar 16000 -ac 1 -c:a pcm_s16le "$env:RUNNER_TEMP\saral-second.wav"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install EXE and test offline speech, saved work and eight cold starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./tools/validate_windows_install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload connected test installers
        uses: actions/upload-artifact@v4
        with:
          name: Saral-connected-${{ matrix.artifact }}
          retention-days: 7
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload synthetic test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saral-evidence-${{ matrix.artifact }}
          retention-days: 7
          path: |
            build/windows-tests.xml
            build/package-smoke.json
            build/windows-evidence/
          if-no-files-found: warn
